<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · Harness 插件交互预览</title>
<style>html,body{margin:0;min-height:100%;background:#101820;color:#dce6ef;font-family:'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}body{display:flex;min-height:100vh}.sidebar{width:215px;border-right:1px solid #d2deef17;padding:28px;background:#131f2b}.brand{font-weight:600;font-size:19px;letter-spacing:1px}.sidebar p{font-size:12px;color:#7995aa;line-height:1.9}.sidebar small{color:#edce94;font-size:10px;letter-spacing:1px}.nav{margin-top:30px;color:#a2b6c9;font-size:13px;line-height:3}.main{padding:48px 50px;max-width:760px;flex:1}.eyebrow{color:#8bd0f5;font-size:10px;letter-spacing:3px}.main h1{font-weight:400;font-size:32px;margin:12px 0 18px;letter-spacing:2px}.intro{color:#a5bacd;font-size:14px;line-height:1.9;max-width:600px}.controls{margin-top:34px;display:flex;flex-wrap:wrap;gap:9px}.controls button{color:#ccdeee;background:#213145;border:1px solid #a6c3dc28;border-radius:9px;padding:11px 15px;font-size:12px}.controls button:hover{background:#304765}.controls button.primary{background:#84c9ed;color:#152c3d}.hint{font-size:11px;color:#7d9cb2;line-height:1.9;margin-top:26px}.event{margin-top:22px;padding:15px 18px;border-left:2px solid #8daaca;color:#b2c5d7;font-size:12px;line-height:1.8;background:#d1e3f306}.composer{position:fixed;bottom:30px;left:290px;right:42px;height:100px;border:1px solid #a6bdcf30;border-radius:18px;color:#768a9d;padding:20px;font-size:13px;background:#192634;pointer-events:none}@media(max-width:700px){.sidebar{display:none}.main{padding:28px 20px}.main h1{font-size:26px}.composer{left:20px;right:20px}.intro{font-size:12px}}</style></head><body>
<aside class="sidebar"><div class="brand">deepseek <small>HARNESS</small></div><p>插件界面交互预览<br>本页使用模拟 Agent 事件</p><div class="nav">＋ 新会话<br>插件<br>工作区<br>大肥鱼</div></aside>
<main class="main"><span class="eyebrow">A LITTLE COMPANY</span><h1>工作有回应，休息有提醒。</h1><p class="intro">点击右侧伙伴查看今日运行时长、声音设置和喝水休息间隔。角色只待在 Harness 的窗口里，后台任务结束和需要确认时可以发出短提示音。</p>
<div class="controls"><button class="primary" data-event="start">开始 Agent A</button><button data-event="start" data-id="demo-b">开始 Agent B</button><button data-event="complete">正常结束 A</button><button data-event="replace">结束 A 并立即开始 B</button><button data-event="error">运行失败 A</button><button data-event="cancel">手动停止 A</button><button data-event="complete" data-id="demo-b">结束 B</button><button data-event="wait">需要用户确认</button><button data-event="answer">用户已确认</button><button data-event="advance">快进 2 小时</button><button data-event="legacy-host">模拟旧后台</button><button data-event="current-host">恢复当前后台</button><button data-event="greet">模拟启动欢迎</button><button data-event="after-welcome">启动 5 分钟后</button><button data-presence="sleep">模拟前台无操作 10 分钟</button><button data-presence="away">模拟切到后台</button><button data-presence="back">模拟返回前台</button></div>
<p class="hint">先点击伙伴开启声音，再模拟运行。<br>并发时间只计一次；“快进 2 小时”只推进模拟的运行时间。<br>拖动伙伴调整位置，按住 Alt 与方向键也可以移动。</p><div class="event" id="event" role="status">准备好了，先开始一项模拟任务吧。</div></main><div class="composer">发送消息或创建任务…</div><div id="pet-root"></div>
<script src="/vendor/react.js"></script><script src="/vendor/react-dom.js"></script>
<script>let petExports;window.__ModuleLoader__={load({factory}){petExports=factory(name=>{if(name==='react')return React;throw Error(name)})}};</script><script src="/lib/client.js"></script>
<script>let appearanceOffset=0,previewForeground=true;const appearanceClock=()=>performance.now()+appearanceOffset;const foregroundCheck=()=>previewForeground;const cleanups=[];const projectListeners=new Set();let projectId="demo-project";const ctx={sessions:{list:{getSnapshot:()=>({byId:{[projectId]:{id:projectId,retainedBy:{mainView:1}}}}),subscribe:fn=>{projectListeners.add(fn);return ()=>projectListeners.delete(fn);}}},effect(fn){cleanups.push(fn())},slots:{inject(key,fn){return fn()},register(options,Component){const root=ReactDOM.createRoot(document.getElementById('pet-root'));root.render(React.createElement(petExports.Pet,{ctx,appearanceClock,foregroundCheck}));return ()=>root.unmount()}},uiWorkspace:{openSession(id){document.getElementById('event').textContent='已定位模拟会话：'+id+'。正式插件会打开 Harness 的对应会话。'}}};petExports.apply(ctx);document.querySelectorAll('[data-event]').forEach(button=>button.addEventListener('click',async()=>{try{const r=await fetch('/preview/event',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:button.dataset.event,id:button.dataset.id||'demo-a'})});const s=await r.json();if(!r.ok)throw Error(s.error);document.getElementById('event').textContent='模拟事件：'+button.textContent+'；当前 '+s.runningCount+' 个 Agent 在运行。';}catch(e){document.getElementById('event').textContent=e.message}}));document.querySelectorAll('[data-presence]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.presence==='sleep')appearanceOffset+=600000;else {previewForeground=b.dataset.presence==='back';window.dispatchEvent(new Event(previewForeground?'focus':'blur'));}document.getElementById('event').textContent='外观模拟：'+b.textContent+'（仅预览窗口）';}));</script><button id="switch-project" style="position:fixed;left:20px;bottom:20px" onclick="projectId=projectId==='demo-project'?'other-project':'demo-project';projectListeners.forEach(fn=>fn());this.textContent=projectId==='demo-project'?'切换到其他项目':'返回演示项目'">切换到其他项目</button></body></html>
